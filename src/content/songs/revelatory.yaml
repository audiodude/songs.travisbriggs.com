note: >-
  I been listening to a lot of electronic music lately to help me fall and stay
  asleep. This sort of comes from a place of trying to write a song I would like
  to fall asleep to. I can see how that is very ironic in a genre known as
  _dance music_. I also applied some of the techniques in the YouTube tutorial I
  made, so that was very satisfying.
