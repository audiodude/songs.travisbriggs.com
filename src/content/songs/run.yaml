note: >-
  This one was a pretty whacky journey. I started writing a bass line, which
  implied a chord progression. And I was trying to use some really out there
  synth sounds, but it wasn't really coming together. So I took what I had,
  which was about 40 seconds, and slapped it into Suno. I was mostly trying to
  get an idea of how to glue these parts together, kind of like a synthetic
  reference track. But the Suno version was pretty good, and I ended up singing
  my original melody over the exact track I download from suno. Hate me if you
  want, I'm just being honest.


  More Suno things at [Null Rail](https://null.dangerthirdrail.com)
